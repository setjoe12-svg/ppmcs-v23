<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#063b73">
<link rel="manifest" href="manifest.webmanifest">
<title>PPMCS | Project Performance Monitoring & Control System</title>
<style>
:root{
 --navy:#063b73;--blue:#0877c9;--green:#08a85a;--gold:#f2b705;--red:#e53935;
 --orange:#f59e0b;--ink:#17324d;--muted:#6c7a89;--bg:#eef3f7;--card:#fff;
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:#17212b}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{height:78px;background:linear-gradient(110deg,#042d5d,#0864a6 55%,#0b7a55);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:12px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:17px}
.brand h1{font-size:20px;margin:0}.brand small{display:block;opacity:.82}.tag{color:#ffd23c;font-weight:700;font-size:15px;font-style:italic}
.user{display:flex;gap:9px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800}
.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 78px)}
aside{background:linear-gradient(#073c74,#062e5b);color:#fff;padding:13px 10px;position:sticky;top:78px;height:calc(100vh - 78px)}
aside button{width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:12px 13px;border-radius:8px;margin:2px 0}
aside button:hover,aside button.active{background:linear-gradient(90deg,#08a85a,#0a8b7b)}
main{padding:20px;max-width:1500px;width:100%;margin:auto}
.pagehead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}.pagehead h2{margin:0;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.card{background:var(--card);border:1px solid #dce4eb;border-radius:12px;padding:15px;box-shadow:0 2px 8px #17324d12}
.kpi{color:#fff;min-height:112px;position:relative;overflow:hidden}.kpi:nth-child(1){background:linear-gradient(135deg,#064383,#0a69aa)}
.kpi:nth-child(2){background:linear-gradient(135deg,#07944d,#0ebd68)}.kpi:nth-child(3){background:linear-gradient(135deg,#e7a800,#f6c12a)}.kpi:nth-child(4){background:linear-gradient(135deg,#d52e2a,#f04b43)}
.kpi h3{margin:0;font-size:13px;opacity:.9}.big{font-size:31px;font-weight:800;margin:10px 0 3px}.link{font-size:12px;opacity:.9}
.title{font-weight:800;color:var(--navy);font-size:16px;margin-bottom:12px}.muted{color:var(--muted);font-size:12px}
.bar{height:9px;background:#e7edf2;border-radius:20px;overflow:hidden}.bar i{height:100%;display:block;background:linear-gradient(90deg,#0877c9,#08a85a)}
.badge{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}.ok{background:#daf5e5;color:#087a42}.risk{background:#fff0c7;color:#936500}.behind{background:#fde0df;color:#a51f1c}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid #e6ebef;text-align:left}th{color:#506070;background:#f7f9fa}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.action{border:0;border-radius:10px;padding:14px 8px;color:#fff;font-weight:750}.a1{background:#0877c9}.a2{background:#08a85a}.a3{background:#e7a800}.a4{background:#6336b5}
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.photo{height:145px;object-fit:cover;width:100%;border-radius:8px;background:#dce4eb}
label{font-size:12px;font-weight:700;display:block;margin:10px 0 5px}input,select,textarea{width:100%;border:1px solid #cdd7df;border-radius:8px;padding:10px;background:#fff}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.primary{border:0;background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;font-weight:700}.secondary{border:0;background:#e9eff4;color:var(--ink);padding:10px 14px;border-radius:8px;font-weight:700}
.chart{height:210px;display:flex;align-items:end;gap:8px;padding:15px 5px;border-bottom:1px solid #ccd6de}.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}.col i{width:100%;max-width:28px;border-radius:5px 5px 0 0;background:#0877c9}.col small{font-size:9px;color:#677}.notice{background:#fff8df;border:1px solid #eedb98;border-radius:8px;padding:10px;font-size:12px}
.footer{color:#71808d;font-size:11px;padding:18px 2px;text-align:right}
.hidden{display:none!important}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}.photo-grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:76px 1fr}aside button span{display:none}aside button{text-align:center}.brand h1{font-size:16px}.tag{display:none}}
@media(max-width:650px){.top{height:68px;padding:0 10px}.layout{display:block}.layout aside{height:auto;position:sticky;top:68px;z-index:19;display:flex;overflow:auto;padding:5px}.layout aside button{min-width:70px;text-align:center;font-size:10px}.layout aside button span{display:block}.grid{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr}main{padding:10px}.pagehead{align-items:flex-start}.user .name{display:none}.photo-grid{grid-template-columns:1fr 1fr}.brand small{display:none}.brand .logo{width:38px;height:38px}.brand h1{font-size:15px}}
</style>
</head>
<body>
<header class="top">
 <div class="brand"><div class="logo">PP</div><div><h1>PPMCS</h1><small>Project Performance Monitoring & Control System</small></div></div>
 <div class="tag">Plan • Monitor • Measure • Deliver</div>
 <div class="user"><span class="name">Adewale Joseph<br><small>Project Director</small></span><div class="avatar">AJ</div></div>
</header>
<div class="layout">
<aside id="side"></aside>
<main id="main"></main>
</div>
<script>
const KEY='ppmcs_v2';
const demo={
 projects:[
 {id:'P001',name:'10,000 sqm Project',stage:'Foundation / Ground Floor',planned:10.5,actual:10.5,status:'On Track',target:'2,000 m³',actualQty:210,unit:'m³',plannedRate:'350 m³/day',next:'Sustain 350 m³/day concrete production',challenges:'Concrete production must be sustained; 1,790 m³ remains.',technical:'Foundation-column jacketing completed in 4 days on 26/09/2026. Concreting commenced.',recommendation:'Track daily pour cards, delivery tickets, slump/cubes, pump and labour capacity.'},
 {id:'P002',name:'32 units Silos Project',stage:'Foundation / Wall Level',planned:50,actual:50,status:'At Risk',target:'32 units',actualQty:4,unit:'units',plannedRate:'2 wall fronts',next:'Close tunnel correction and continue two-wall formwork',challenges:'Tunnel misalignment correction requires dimensional verification and hold points.',technical:'Four of the 32 silos are currently at foundation/wall level. Hoist crane installation completed; formwork for two silo walls ongoing.',recommendation:'Survey corrected tunnel alignment and obtain engineering acceptance before closure.'},
 {id:'P003',name:'Parcel E Roads Construction',stage:'Setting Out / Mobilisation',planned:100,actual:70,status:'At Risk',target:'Setting out',actualQty:70,unit:'%',plannedRate:'100% accessible fronts',next:'Open remaining fronts and commence bulk earthworks',challenges:'Access limits setting out; remaining plant mobilises from 28/09/2026.',technical:'70% setting out completed in accessible areas. 2 bulldozers and 1 excavator mobilised 26/09/2026.',recommendation:'Track cut/fill and chainage production daily; mobilise grader, roller, water tanker and trucks.'},
 {id:'P004',name:'Construction of Gbadamosi Alo Road at Abidjo',stage:'Earthworks / Drainage',planned:100,actual:0,status:'At Risk',target:'Earthworks + drainage',actualQty:0,unit:'%',plannedRate:'Continuous works',next:'New SPE resumes 28/09; mobilise paver and reinforcement',challenges:'SPE change creates supervision continuity risk; pavement readiness must be coordinated.',technical:'Earthworks and drainage ongoing. Paver planned; reinforcement mobilised.',recommendation:'Formal SPE handover and confirm pavement sequence, levels, reinforcement and QA/QC hold points.'},
 {id:'P005',name:'Construction of Culvert along Road to Parcel D',stage:'Setting Out / River Diversion',planned:100,actual:100,status:'On Track',target:'Hardcore supplied',actualQty:160,unit:'t',plannedRate:'Diversion → excavation → hardcore',next:'Complete river diversion and commence excavation/hardcore',challenges:'Diversion and dewatering must maintain a safe excavation environment.',technical:'Setting out complete; excavator mobilised 26/09/2026; 160 t hardcore supplied.',recommendation:'Verify founding formation before hardcore placement and track compaction quantities.'},
 {id:'P006',name:'84m Sheet Pilling Works',stage:'Pre-construction / Site Preparation',planned:84,actual:30,status:'At Risk',target:'84 m',actualQty:30,unit:'m',plannedRate:'84 m total',next:'Start available 30 m and reinstate eroded areas',challenges:'Erosion leaves only ~30 m accessible; client materials planned from 28/09.',technical:'Vendor site meeting completed. 3 m road-edge offset and embankment slope agreed.',recommendation:'Survey alignment, refill affected areas and track client-supplied materials against vendor schedule.'},
 {id:'P007',name:'550m Truck Restraint Crash Barrier at Parking Level 1',stage:'Foundation / Formwork',planned:100,actual:20,status:'At Risk',target:'550 m',actualQty:100,unit:'m commenced',plannedRate:'550 m total',next:'Receive steel formwork and accelerate casting',challenges:'Vendor steel formwork ready 26/09 but not yet received on site.',technical:'First 100 m foundation and toe/heel casting commenced as the initial section of the 550 m crash-barrier scope.',recommendation:'Expedite formwork, conduct first-off inspection and establish casting/formwork turnaround.'},
 {id:'P008',name:'Igbodu Road Infrastructure Project',stage:'Mobilisation / Grading',planned:100,actual:50,status:'On Track',target:'6 equipment types',actualQty:6,unit:'equipment types',plannedRate:'Complete mobilisation',next:'Complete mobilisation and grade critical access routes',challenges:'HM visit creates time-sensitive access-road improvement requirement.',technical:'Bulldozer, excavator, roller, grader, payloader and water tanker mobilisation ongoing.',recommendation:'Deploy plant in grading → watering → compaction sequence and record completed areas.'}
 ], entries:[],photos:[],weather:{condition:'Partly Cloudy',temp:'32',rain:'0.0',humidity:'68',wind:'12',impact:'Good'}
};
let s=JSON.parse(localStorage.getItem(KEY)||'null')||demo;
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
const navItems=[['dashboard','⌂','Dashboard'],['projects','▦','Projects'],['programme','▤','Programme / WBS'],['daily','✓','Daily Progress'],['photos','▣','Progress Pictures'],['weather','☁','Weather Report'],['weekly','▥','Weekly Performance'],['monthly','▥','Monthly Performance'],['evm','◈','S-Curve & Earned Value'],['reports','▤','Reports'],['risks','!','Issues & Risks'],['settings','⚙','Settings']];
const side=document.getElementById('side');
side.innerHTML=navItems.map(x=>`<button data-p="${x[0]}" onclick="go('${x[0]}')">${x[1]} <span>${x[2]}</span></button>`).join('');
function go(p){document.querySelectorAll('aside button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));({dashboard,projects,programme,daily,photos,weather,weekly,monthly,evm,reports,risks,settings}[p]||dashboard)()}
function statusBadge(x){return x==='Completed'?'<span class="badge ok">Completed</span>':x==='On Track'?'<span class="badge ok">On Track</span>':x==='At Risk'?'<span class="badge risk">At Risk</span>':'<span class="badge behind">Behind</span>'}
function dashboard(){
 let planned=s.projects.reduce((a,p)=>a+p.planned,0)/s.projects.length, actual=s.projects.reduce((a,p)=>a+p.actual,0)/s.projects.length;
 const variance=actual-planned;
 main.innerHTML=`<div class="pagehead"><div><h2>Portfolio Executive Dashboard</h2><div class="muted">PPMCS v2 · Reporting date: 28 September 2026 · 8 active projects</div></div><span class="badge risk">Data-driven pilot</span></div>
 <div class="grid"><div class="card kpi"><h3>Total Projects</h3><div class="big">${s.projects.length}</div><div class="link">8 management dashboards</div></div><div class="card kpi"><h3>On Track</h3><div class="big">${s.projects.filter(p=>p.status==='On Track').length}</div><div class="link">Current portfolio status</div></div><div class="card kpi"><h3>At Risk</h3><div class="big">${s.projects.filter(p=>p.status==='At Risk').length}</div><div class="link">Management attention</div></div><div class="card kpi"><h3>Behind</h3><div class="big">${s.projects.filter(p=>p.status==='Behind').length}</div><div class="link">Recovery action</div></div></div>
 <div class="grid3" style="margin-top:13px"><div class="card"><div class="title">Portfolio Progress Gauge</div><div style="width:170px;height:170px;margin:5px auto 15px;border-radius:50%;background:conic-gradient(#0877c9 ${Math.max(0,Math.min(100,actual))}%,#dfe8ee 0);display:grid;place-items:center"><div style="width:122px;height:122px;border-radius:50%;background:white;display:grid;place-items:center;text-align:center;font-weight:900;font-size:25px">${actual.toFixed(1)}%<small style="font-size:10px">Actual</small></div></div><div class="row" style="justify-content:center"><span>Plan <b>${planned.toFixed(1)}%</b></span><span>Var <b style="color:${variance<0?'#e53935':'#08a85a'}">${variance.toFixed(1)}%</b></span></div></div><div class="card"><div class="title">Project Performance</div><div class="chart">${s.projects.map(p=>`<div class="col"><i style="height:${Math.max(8,Math.min(180,p.actual*1.8))}px;background:${p.status==='On Track'?'#08a85a':p.status==='At Risk'?'#f59e0b':'#e53935'}"></i><small>${p.id}</small></div>`).join('')}</div><div class="muted">Actual progress by project · click a project below for detail.</div></div><div class="card"><div class="title">Management Attention</div>${s.projects.filter(p=>p.status!=='On Track').map(p=>`<div class="notice" style="margin-bottom:7px;cursor:pointer" onclick="projectDetail('${p.id}')"><b>${p.name}</b><br><span class="muted">${p.challenges}</span></div>`).join('')||'<div class="notice">No active exceptions.</div>'}</div></div>
 <div class="card" style="margin-top:13px"><div class="title">8-Project Management Matrix</div><table><tr><th>Project</th><th>Stage</th><th>Plan</th><th>Actual</th><th>Variance</th><th>KPI</th><th>Status</th></tr>${s.projects.map(p=>`<tr style="cursor:pointer" onclick="projectDetail('${p.id}')"><td><b>${p.name}</b></td><td>${p.stage}</td><td>${p.planned}%</td><td>${p.actual}%</td><td style="color:${p.actual-p.planned<0?'#e53935':'#08a85a'}"><b>${(p.actual-p.planned).toFixed(1)}%</b></td><td>${p.actualQty} ${p.unit}</td><td>${statusBadge(p.status)}</td></tr>`).join('')}</table></div>
 <div class="card" style="margin-top:13px"><div class="title">Latest Management Actions</div><div class="grid3">${s.projects.map(p=>`<div class="notice"><b>${p.name}</b><br>${p.next}</div>`).join('')}</div></div>`}
function projects(){main.innerHTML=`<div class="pagehead"><div><h2>Projects — Data Driven Portfolio</h2><div class="muted">Select any project to open its management dashboard.</div></div><button class="primary" onclick="addProject()">+ Add Project</button></div><div class="grid3">${s.projects.map(p=>`<div class="card" style="cursor:pointer" onclick="projectDetail('${p.id}')"><div class="row" style="justify-content:space-between"><div><b>${p.name}</b><div class="muted">${p.stage} · ${p.id}</div></div>${statusBadge(p.status)}</div><div style="margin:12px 0" class="bar"><i style="width:${Math.min(100,p.actual)}%"></i></div><div class="row"><span>Plan <b>${p.planned}%</b></span><span>Actual <b>${p.actual}%</b></span><span>Var <b>${(p.actual-p.planned).toFixed(1)}%</b></span></div><div class="muted" style="margin-top:10px">KPI: ${p.actualQty} ${p.unit} · ${p.next}</div></div>`).join('')}</div>`}
function projectDetail(id){const p=s.projects.find(x=>x.id===id);if(!p)return projects();const v=p.actual-p.planned;main.innerHTML=`<div class="pagehead"><div><h2>${p.name}</h2><div class="muted">${p.stage} · ${p.id}</div></div><div class="row"><button class="secondary" onclick="projects()">← Portfolio</button>${statusBadge(p.status)}</div></div><div class="grid"><div class="card kpi"><h3>Actual Progress</h3><div class="big">${p.actual}%</div><div class="link">${p.actualQty} ${p.unit}</div></div><div class="card kpi"><h3>Planned</h3><div class="big">${p.planned}%</div><div class="link">Baseline / target</div></div><div class="card kpi"><h3>Variance</h3><div class="big">${v.toFixed(1)}%</div><div class="link">Actual − Planned</div></div><div class="card kpi"><h3>Current KPI</h3><div class="big">${p.target}</div><div class="link">${p.plannedRate}</div></div></div><div class="grid3" style="margin-top:13px"><div class="card"><div class="title">Management Status</div><div style="font-size:58px;font-weight:900;color:${p.status==='On Track'?'#08a85a':p.status==='At Risk'?'#f59e0b':'#e53935'}">${p.actual}%</div><div class="bar"><i style="width:${Math.min(100,p.actual)}%"></i></div><p>Current status: <b>${p.status}</b></p><p class="muted">Next action: ${p.next}</p></div><div class="card"><div class="title">Technical Progress</div><p>${p.technical}</p><div class="notice"><b>Challenge:</b> ${p.challenges}</div></div><div class="card"><div class="title">Recommendation</div><p>${p.recommendation}</p><div class="notice"><b>Reporting discipline:</b> update quantity, photo, chainage/location and constraint after each daily submission.</div></div></div><div class="card" style="margin-top:13px"><div class="title">Update Project KPI</div><div class="grid3"><div><label>Planned %</label><input id="ep" type="number" step="0.1" value="${p.planned}"></div><div><label>Actual %</label><input id="ea" type="number" step="0.1" value="${p.actual}"></div><div><label>Status</label><select id="es"><option ${p.status==='On Track'?'selected':''}>On Track</option><option ${p.status==='At Risk'?'selected':''}>At Risk</option><option ${p.status==='Behind'?'selected':''}>Behind</option><option ${p.status==='Completed'?'selected':''}>Completed</option></select></div></div><label>Next Action</label><input id="en" value="${p.next}"><label>Challenge</label><textarea id="ec" rows="2">${p.challenges}</textarea><button class="primary" style="margin-top:10px" onclick="updateProject('${p.id}')">Save KPI / Status</button></div><div class="card" style="margin-top:13px"><div class="title">Project Daily Records</div><table><tr><th>Date</th><th>Activity</th><th>Location</th><th>Actual</th><th>Remarks</th></tr>${s.entries.filter(e=>e.project===p.id).slice(-10).reverse().map(e=>`<tr><td>${e.date}</td><td>${e.activity}</td><td>${e.location}</td><td>${e.qty} ${e.unit}</td><td>${e.remarks||''}</td></tr>`).join('')||'<tr><td colspan="5">No daily records yet.</td></tr>'}</table></div>`}
function updateProject(id){const p=s.projects.find(x=>x.id===id);p.planned=+ep.value||0;p.actual=+ea.value||0;p.status=es.value;p.next=en.value;p.challenges=ec.value;save();projectDetail(id)}
function addProject(){let n=prompt('Project name');if(n){s.projects.push({id:'P'+String(Date.now()).slice(-5),name:n,planned:0,actual:0,status:'On Track'});save();projects()}}
function programme(){main.innerHTML=`<div class="pagehead"><h2>Programme / WBS</h2><button class="secondary">Import P6 / MSP</button></div><div class="card"><div class="notice">Pilot structure supports project → WBS → activity → quantity. Production version will import Primavera P6/MS Project baselines and map activity weights automatically.</div><h3>Sample WBS – Parcel E Roads Construction</h3><table><tr><th>WBS</th><th>Activity</th><th>Weight</th><th>Planned</th><th>Actual</th></tr>${[['1.0','Preliminaries','5%','100%','100%'],['2.0','Earthworks','15%','92%','87%'],['3.0','Drainage','15%','70%','64%'],['4.0','Sub-base','10%','60%','51%'],['5.0','Base Course','10%','40%','38%'],['6.0','RC Pavement','35%','20%','18%'],['7.0','Walkways & Lighting','10%','15%','11%']].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`}
function daily(){main.innerHTML=`<div class="pagehead"><h2>Daily Progress</h2><span class="badge ok">Site Submission</span></div><div class="card"><div class="grid3"><div><label>Project</label><select id="dp">${s.projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div><label>Date</label><input id="dd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Location / Chainage</label><input id="dl" placeholder="Road 3, Ch 1+250–1+350"></div></div><label>Activity</label><input id="da" placeholder="e.g. Drainage construction"><div class="grid3"><div><label>Planned Quantity</label><input id="dpl" type="number"></div><div><label>Actual Quantity</label><input id="dac" type="number"></div><div><label>Unit</label><input id="du" placeholder="m, m², m³, t"></div></div><label>Manpower / Equipment</label><input id="dr" placeholder="35 workers · 2 excavators · 6 trucks"><label>Constraints / Remarks</label><textarea id="dn" rows="3"></textarea><div class="row" style="margin-top:12px"><button class="primary" onclick="saveDaily()">Save Daily Record</button><button class="secondary" onclick="go('photos')">Attach Progress Pictures</button></div></div><div class="card" style="margin-top:12px"><div class="title">Recent Submissions</div><table><tr><th>Date</th><th>Activity</th><th>Location</th><th>Actual</th></tr>${s.entries.slice(-10).reverse().map(e=>`<tr><td>${e.date}</td><td>${e.activity}</td><td>${e.location}</td><td>${e.qty} ${e.unit}</td></tr>`).join('')||'<tr><td colspan="4">No submissions yet.</td></tr>'}</table></div>`}
function saveDaily(){s.entries.push({project:dp.value,date:dd.value,location:dl.value,activity:da.value||'Unspecified',pqty:+dpl.value||0,qty:+dac.value||0,unit:du.value||'',remarks:dn.value});save();alert('Daily progress saved and linked to the selected project.');projectDetail(dp.value)}
function photos(){main.innerHTML=`<div class="pagehead"><h2>Progress Pictures</h2><span class="badge ok">${s.photos.length} pictures</span></div><div class="card"><label>Activity / Chainage Caption</label><input id="cap" placeholder="e.g. Road 3 – Drainage Ch 1+250"><label>Take or Upload Pictures</label><input id="pi" type="file" accept="image/*" capture="environment" multiple onchange="uploadPhotos(event)"><div class="notice" style="margin-top:10px">Each photograph should be linked to project, activity, date/time and location in the production version. The pilot stores images locally on this device.</div></div><div class="photo-grid" style="margin-top:12px">${s.photos.slice().reverse().map((x,i)=>`<div class="card"><img class="photo" src="${x.data}"><b>${x.caption}</b><div class="muted">${x.date}</div></div>`).join('')}</div>`}
function uploadPhotos(ev){[...ev.target.files].forEach(f=>{let r=new FileReader();r.onload=()=>{s.photos.push({data:r.result,caption:cap.value||'Progress picture',date:new Date().toLocaleString()});save();photos()};r.readAsDataURL(f)})}

// PPMCS v2.1 Mobile Field Operations extension
const PHOTO_DB='ppmcs-photo-db-v21', PHOTO_STORE='photos';
let pendingPhotoFiles=[];
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(PHOTO_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(PHOTO_STORE,{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function photoPut(x){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).put(x);tx.oncomplete=()=>res(x.id);tx.onerror=()=>rej(tx.error)})}
async function photoAll(){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction(PHOTO_STORE).objectStore(PHOTO_STORE).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}
async function photoDelete(id){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}

 main.innerHTML=`<div class="pagehead"><div><h2>Portfolio Executive Dashboard</h2><div class="muted">PPMCS v2.1 · Mobile Field Operations · 28 September 2026</div></div><div class="row"><span class="badge ok">Offline Ready</span><button class="primary" onclick="installApp()">＋ Install App</button></div></div><div class="actions"><button class="action a1" onclick="daily()">✓ Daily Report</button><button class="action a2" onclick="mobilePhotos(s.projects[0].id,'')">📷 Site Photo</button><button class="action a3" onclick="go('projects')">▦ Projects</button><button class="action a4" onclick="syncNow()">↻ Sync</button></div><div class="grid" style="margin-top:13px"><div class="card kpi"><h3>Total Projects</h3><div class="big">${s.projects.length}</div><div class="link">Current portfolio</div></div><div class="card kpi"><h3>On Track</h3><div class="big">${s.projects.filter(p=>p.status==='On Track').length}</div><div class="link">Management status</div></div><div class="card kpi"><h3>At Risk</h3><div class="big">${s.projects.filter(p=>p.status==='At Risk').length}</div><div class="link">Attention required</div></div><div class="card kpi"><h3>Site Photos</h3><div class="big">${photos.length}</div><div class="link">Stored on device</div></div></div><div class="grid3" style="margin-top:13px"><div class="card"><div class="title">Portfolio Progress</div><div style="width:170px;height:170px;margin:5px auto 15px;border-radius:50%;background:conic-gradient(#0877c9 ${Math.max(0,Math.min(100,actual))}%,#dfe8ee 0);display:grid;place-items:center"><div style="width:122px;height:122px;border-radius:50%;background:white;display:grid;place-items:center;text-align:center;font-weight:900;font-size:25px">${actual.toFixed(1)}%<small style="font-size:10px">Actual</small></div></div><div class="row" style="justify-content:center"><span>Plan <b>${planned.toFixed(1)}%</b></span><span>Var <b style="color:${variance<0?'#e53935':'#08a85a'}">${variance.toFixed(1)}%</b></span></div></div><div class="card"><div class="title">Project Progress</div><div class="chart">${s.projects.map(p=>`<div class="col"><i style="height:${Math.max(8,Math.min(180,p.actual*1.8))}px;background:${p.status==='On Track'?'#08a85a':p.status==='At Risk'?'#f59e0b':'#e53935'}"></i><small>${p.id}</small></div>`).join('')}</div><div class="muted">Tap project cards below for technical dashboard.</div></div><div class="card"><div class="title">Field Data Queue</div><div class="big" style="color:var(--navy)">${s.entries.filter(e=>e.sync==='pending').length}</div><p class="muted">Daily reports waiting for cloud synchronisation.</p><div class="notice">The mobile app remains usable when connectivity is unavailable.</div></div></div><div class="card" style="margin-top:13px"><div class="title">8-Project Management Matrix</div><table><tr><th>Project</th><th>Stage</th><th>Plan</th><th>Actual</th><th>Variance</th><th>Status</th></tr>${s.projects.map(p=>`<tr style="cursor:pointer" onclick="projectDetail('${p.id}')"><td><b>${p.name}</b></td><td>${p.stage}</td><td>${p.planned}%</td><td>${p.actual}%</td><td>${(p.actual-p.planned).toFixed(1)}%</td><td>${statusBadge(p.status)}</td></tr>`).join('')}</table></div>`}

<script>
/* PPMCS v2.2 cloud/API bridge */
const PPMCS_API = localStorage.getItem('ppmcs_api') || '/api';
async function apiCall(path, options={}) {
  const token=localStorage.getItem('ppmcs_token'); const headers={'Content-Type':'application/json',...(options.headers||{})}; if(token) headers.Authorization='Bearer '+token; const res=await fetch(PPMCS_API+path,{headers,...options});
  if(!res.ok) throw new Error((await res.text())||('HTTP '+res.status));
  return res.json();
}
async function loadCloudState(){
  try{
    const cloud=await apiCall('/state');
    if(cloud && cloud.projects){
      s.projects=cloud.projects;
      s.entries=cloud.entries||[];
      save();
      return true;
    }
  }catch(e){ console.warn('Cloud state unavailable; offline mode remains active.',e); }
  return false;
}
async function syncCloud(){
  const photos=await photoAll();
  let uploaded=0, failed=0;
  try{
    const r=await apiCall('/reports/bulk',{method:'POST',body:JSON.stringify({reports:s.entries.filter(e=>e.sync==='pending')})});
    if(r.ok){s.entries=s.entries.map(e=>e.sync==='pending'?{...e,sync:'synced'}:e);uploaded+=r.count||0;}
  }catch(e){failed+=s.entries.filter(e=>e.sync==='pending').length;}
  for(const p of photos.filter(x=>x.sync==='pending')){
    try{
      await apiCall('/photos',{method:'POST',body:JSON.stringify(p)});
      await photoPut({...p,sync:'synced'}); uploaded++;
    }catch(e){failed++;}
  }
  save();
  return {uploaded,failed};
}
const _oldSyncNow=window.syncNow;
window.syncNow=async function(){
  const before=s.entries.filter(e=>e.sync==='pending').length+(await photoAll()).filter(x=>x.sync==='pending').length;
  if(!navigator.onLine){alert(`${before} item(s) queued. Device is offline.`);return;}
  const r=await syncCloud();
  const remain=s.entries.filter(e=>e.sync==='pending').length+(await photoAll()).filter(x=>x.sync==='pending').length;
  alert(`Sync complete.\nUploaded: ${r.uploaded}\nFailed: ${r.failed}\nRemaining queue: ${remain}`);
  go('dashboard');
};
window.addEventListener('online',()=>syncCloud().catch(()=>{}));
window.addEventListener('load',()=>{if(localStorage.getItem('ppmcs_token')){loadCloudState().then(()=>go('dashboard')).catch(()=>{document.getElementById('authGate').style.display='flex'})}else document.getElementById('authGate').style.display='flex'});
</script>
